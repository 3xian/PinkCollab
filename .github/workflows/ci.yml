name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gateway: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.gateway == 'true' }}
      android: ${{ steps.scope.outputs.full == 'true' || steps.filter.outputs.android == 'true' }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0
      - name: Check comparison baseline
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # The PR files API exposes at most 3000 files. An incomplete list must
          # never make a heavy job look unnecessary.
          full=true
          if [[ "$EVENT_NAME" == pull_request && "$PR_CHANGED_FILES" =~ ^[0-9]+$ && "$PR_CHANGED_FILES" -lt 3000 ]]; then
            full=false
          elif [[ "$EVENT_NAME" == push && "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0{40}$ ]] && git cat-file -e "$BEFORE^{commit}"; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: steps.scope.outputs.full != 'true'
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            gateway:
              - 'gateway/**'
              - '.github/**'
              - '.gitattributes'
              - 'docs/protocol.md'
              - 'npm/pinkcollab/platforms.json'
              - 'npm/scripts/build-matrix.mjs'
            android:
              - 'android/**'
              - '.github/**'
              - '.gitattributes'
              - 'docs/protocol.md'
      - name: Export release cache matrix
        id: matrix
        if: github.event_name != 'pull_request'
        run: echo "value=$(node npm/scripts/build-matrix.mjs)" >> "$GITHUB_OUTPUT"
  npm:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # check-release.mjs invokes cargo metadata --locked.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node npm/scripts/check-release.mjs
      - run: npm test --prefix npm/pinkcollab
      - run: npm pack ./npm/pinkcollab --dry-run
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-website
  gateway:
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - name: Isolate Rust toolchains
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/pinkcollab-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
          shared-key: gateway-checks
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      # Release binaries are built for all five supported targets by release-cache
      # on pushes/manual runs and by Release on tags. Keep native checks in the test profile.
      - run: cargo build --locked --bin pinkcollab-gateway
  # Tag caches are scoped to that tag. Populate the default-branch caches with
  # the same runners, targets and build flags used by Release.
  release-cache:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.gateway == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-gateway
        with:
          target: ${{ matrix.target }}
  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: checks
          - suite: device-tests
            command: ./gradlew :app:connectedDebugAndroidTest --console=plain || { sudo dmesg; exit 1; }
          - suite: release-device-tests
            command: ./gradlew :app:connectedReleaseTestAndroidTest -PtestBuildType=releaseTest -Pandroid.testInstrumentationRunnerArguments.class=dev.pinkcollab.ui.ReleaseMarkdownDeviceTest --console=plain
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runners already ship the Android SDK, so only the packages this
      # project needs are installed here. (why: android-actions/setup-android@v3
      # still requests the retired `tools` package, which current cmdline-tools
      # cannot resolve, and fails the job before Gradle ever runs.)
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Build Android and run unit tests and lint
        if: matrix.suite == 'checks'
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v7
        if: matrix.suite == 'checks'
        with:
          name: pinkcollab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for Android emulator
        if: matrix.suite != 'checks'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Debug and optimized tests run on separate runners so R8 does not sit
      # behind the full debug suite. Both remain required by ci-required.
      # AOSP removes unrelated Google services; cold boot avoids stale renderer snapshot state.
      - name: Run Android device tests (${{ matrix.suite }})
        if: matrix.suite != 'checks'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 36.1.9: 37.1.11 can crash the Linux GLES host (bdero/flutter_scene#314).
          emulator-build: 13823996
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 2048M
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ${{ matrix.command }}
      - name: Upload device test report
        if: failure() && matrix.suite != 'checks'
        uses: actions/upload-artifact@v7
        with:
          name: pinkcollab-android-${{ matrix.suite }}
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore

  ci-required:
    name: ci-required
    needs: [changes, npm, website, gateway, release-cache, android]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          GATEWAY_NEEDED: ${{ needs.changes.outputs.gateway }}
          GATEWAY_RESULT: ${{ needs.gateway.result }}
          RELEASE_CACHE_NEEDED: ${{ github.event_name != 'pull_request' && needs.changes.outputs.gateway == 'true' }}
          RELEASE_CACHE_RESULT: ${{ needs.release-cache.result }}
          ANDROID_NEEDED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          for result in "$CHANGES_RESULT" "$NPM_RESULT" "$WEBSITE_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A mandatory CI job ended with $result"
              exit 1
            fi
          done
          case "$GATEWAY_NEEDED:$GATEWAY_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::Gateway was required=$GATEWAY_NEEDED but ended with $GATEWAY_RESULT"; exit 1 ;;
          esac
          case "$RELEASE_CACHE_NEEDED:$RELEASE_CACHE_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::Gateway release builds were required=$RELEASE_CACHE_NEEDED but ended with $RELEASE_CACHE_RESULT"; exit 1 ;;
          esac
          case "$ANDROID_NEEDED:$ANDROID_RESULT" in
            true:success|false:skipped) ;;
            *) echo "::error::Android was required=$ANDROID_NEEDED but ended with $ANDROID_RESULT"; exit 1 ;;
          esac
