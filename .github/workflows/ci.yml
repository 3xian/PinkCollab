name: CI
on: [push, pull_request]
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node npm/scripts/check-release.mjs
      - run: npm test --prefix npm/pinkcollab
      - run: npm pack ./npm/pinkcollab --dry-run
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/check-website
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked --bin pinkcollab-gateway
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runners already ship the Android SDK, so only the packages this
      # project needs are installed here. (why: android-actions/setup-android@v3
      # still requests the retired `tools` package, which current cmdline-tools
      # cannot resolve, and fails the job before Gradle ever runs.)
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: pinkcollab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
