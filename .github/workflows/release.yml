name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets must be recovered
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release versions
        run: node npm/scripts/check-release.mjs "$RELEASE_TAG"
      - name: Verify tag annotation and release notes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -e "docs/releases/$RELEASE_TAG.md" ]; then
            node npm/scripts/check-tag-notes.mjs "$RELEASE_TAG"
          fi
      - name: Export build matrix
        id: matrix
        run: echo "value=$(node npm/scripts/build-matrix.mjs)" >> "$GITHUB_OUTPUT"
      - name: Test npm launcher
        run: npm test --prefix npm/pinkcollab
      - name: Inspect main npm package
        run: npm pack ./npm/pinkcollab --dry-run
      - name: Check Gateway formatting
        working-directory: gateway
        run: cargo fmt --check
      - name: Lint Gateway
        working-directory: gateway
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test Gateway
        working-directory: gateway
        run: cargo test --all-features --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install musl build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
          key: ${{ matrix.target }}
      - name: Build Gateway
        working-directory: gateway
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --bin pinkcollab-gateway --target ${{ matrix.target }}
      - name: Stage binary
        shell: pwsh
        run: |
          $source = "gateway/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $destination = "dist/${{ matrix.id }}/${{ matrix.binary }}"
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          if ("${{ runner.os }}" -ne "Windows") { chmod 755 $destination }
      - name: Install tarballs and test launcher
        run: node npm/scripts/smoke-package.mjs "${{ matrix.id }}" "dist/${{ matrix.id }}/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v5
        with:
          name: gateway-${{ matrix.id }}
          path: dist/${{ matrix.id }}/${{ matrix.binary }}
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinkcollab-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pinkcollab-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - name: Build and test signed release APK
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --console=plain
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose
          app/build/outputs/apk/release/app-release.apk
      - name: Stage APK
        run: |
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/app-release.apk ../dist/android/pinkcollab-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: dist/android/pinkcollab-android.apk
          if-no-files-found: error


  npm-publish:
    needs: [build, android]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          pattern: gateway-*
          path: artifacts
      - name: Assemble platform packages
        run: node npm/scripts/stage-artifacts.mjs packages artifacts npm/platforms
      - name: Validate package contents
        run: |
          node npm/scripts/check-release.mjs "$RELEASE_TAG"
          npm test --prefix npm/pinkcollab
          npm pack ./npm/pinkcollab --dry-run
          for package_dir in npm/platforms/*; do
            npm pack "./$package_dir" --dry-run
          done
      - name: Publish platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package_dir in npm/platforms/*; do
            npm publish "./$package_dir" --access public --provenance
          done
      - name: Publish main package last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./npm/pinkcollab --access public --provenance


  github-release:
    needs: [build, android, npm-publish]
    if: ${{ always() && needs.build.result == 'success' && needs.android.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.npm-publish.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          pattern: gateway-*
          path: artifacts
      - uses: actions/download-artifact@v5
        with:
          name: android-release
          path: release-assets
      - name: Prepare release assets
        run: |
          node npm/scripts/stage-artifacts.mjs release artifacts release-assets
          cd release-assets
          sha256sum pinkcollab-* > SHA256SUMS
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --notes-file "$notes" --title "$RELEASE_TAG"
          else
            # Recovery of tags published before versioned release notes were required.
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
