name: Check website
description: Verify the GitHub Pages site (links, assets, and doc agreement).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Static integrity, links and doc agreement
      shell: bash
      run: node .github/actions/check-website/check-site.mjs
