# The Gateway always listens on loopback and never handles TLS itself.
# Publish it with Tailscale Funnel/serve or an HTTPS reverse proxy,
# which terminates TLS and forwards to 127.0.0.1:8787.
listen: 127.0.0.1:8787
public_url: https://dev-server.example.com
name: dev-server
workspaces:
  - ~/projects
omp: omp
omp_args: []
max_sessions: 8
