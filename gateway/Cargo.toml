[package]
name = "pinkcollab-gateway"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[features]
test-fixtures = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
parking_lot = "0.12"
qrcode = "0.14"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "omp-fixture"
path = "tests/fixtures/omp.rs"
required-features = ["test-fixtures"]
